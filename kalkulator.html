<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .container {
            display: flex;
            gap: 20px;
            max-width: 900px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }

        .calculator {
            background: linear-gradient(145deg, #ffffff, #f0f0f0);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 25px;
            width: 380px;
        }

        .display-container {
            background: linear-gradient(145deg, #2c3e50, #34495e);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        #previous-display {
            width: 100%;
            height: 25px;
            font-size: 14px;
            text-align: right;
            color: #95a5a6;
            margin-bottom: 5px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #display {
            width: 100%;
            height: 60px;
            font-size: 36px;
            text-align: right;
            background: transparent;
            border: none;
            color: #ecf0f1;
            font-weight: bold;
            outline: none;
        }

        #realtime-result {
            width: 100%;
            height: 25px;
            font-size: 14px;
            text-align: right;
            color: #2ecc71;
            margin-top: 5px;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 600;
            min-height: 25px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            padding: 22px;
            font-size: 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        button:active {
            transform: translateY(0);
        }

        .number {
            background: linear-gradient(145deg, #ecf0f1, #bdc3c7);
            color: #2c3e50;
        }

        .number:hover {
            background: linear-gradient(145deg, #bdc3c7, #ecf0f1);
        }

        .operator {
            background: linear-gradient(145deg, #f39c12, #e67e22);
            color: white;
        }

        .operator:hover {
            background: linear-gradient(145deg, #e67e22, #f39c12);
        }

        .function {
            background: linear-gradient(145deg, #3498db, #2980b9);
            color: white;
        }

        .function:hover {
            background: linear-gradient(145deg, #2980b9, #3498db);
        }

        .equals {
            background: linear-gradient(145deg, #2ecc71, #27ae60);
            color: white;
            grid-column: span 2;
        }

        .equals:hover {
            background: linear-gradient(145deg, #27ae60, #2ecc71);
        }

        .clear {
            background: linear-gradient(145deg, #e74c3c, #c0392b);
            color: white;
        }

        .clear:hover {
            background: linear-gradient(145deg, #c0392b, #e74c3c);
        }

        .backspace {
            background: linear-gradient(145deg, #9b59b6, #8e44ad);
            color: white;
        }

        .backspace:hover {
            background: linear-gradient(145deg, #8e44ad, #9b59b6);
        }

        /* History Panel */
        .history-panel {
            background: linear-gradient(145deg, #ffffff, #f0f0f0);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 25px;
            width: 300px;
            max-height: 500px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #ecf0f1;
        }

        .history-header h3 {
            color: #2c3e50;
            font-size: 20px;
        }

        .clear-history {
            padding: 8px 16px;
            font-size: 14px;
            background: linear-gradient(145deg, #e74c3c, #c0392b);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .clear-history:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 10px;
        }

        .history-list::-webkit-scrollbar {
            width: 8px;
        }

        .history-list::-webkit-scrollbar-track {
            background: #ecf0f1;
            border-radius: 10px;
        }

        .history-list::-webkit-scrollbar-thumb {
            background: #bdc3c7;
            border-radius: 10px;
        }

        .history-item {
            background: linear-gradient(145deg, #f8f9fa, #e9ecef);
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 4px solid #3498db;
        }

        .history-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .history-expression {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 5px;
        }

        .history-result {
            font-size: 18px;
            color: #2c3e50;
            font-weight: bold;
            text-align: right;
        }

        .no-history {
            text-align: center;
            color: #95a5a6;
            padding: 40px 20px;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                align-items: center;
            }

            .history-panel {
                width: 380px;
                max-height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="calculator">
            <div class="display-container">
                <div id="previous-display"></div>
                <input type="text" id="display" readonly>
                <div id="realtime-result"></div>
            </div>
            <div class="buttons">
                <button class="clear" onclick="clearDisplay()">C</button>
                <button class="backspace" onclick="backspace()">⌫</button>
                <button class="function" onclick="appendToDisplay('(')">(</button>
                <button class="function" onclick="appendToDisplay(')')">)</button>
                
                <button class="number" onclick="appendToDisplay('7')">7</button>
                <button class="number" onclick="appendToDisplay('8')">8</button>
                <button class="number" onclick="appendToDisplay('9')">9</button>
                <button class="operator" onclick="appendToDisplay('/')">÷</button>
                
                <button class="number" onclick="appendToDisplay('4')">4</button>
                <button class="number" onclick="appendToDisplay('5')">5</button>
                <button class="number" onclick="appendToDisplay('6')">6</button>
                <button class="operator" onclick="appendToDisplay('*')">×</button>
                
                <button class="number" onclick="appendToDisplay('1')">1</button>
                <button class="number" onclick="appendToDisplay('2')">2</button>
                <button class="number" onclick="appendToDisplay('3')">3</button>
                <button class="operator" onclick="appendToDisplay('-')">−</button>
                
                <button class="number" onclick="appendToDisplay('0')">0</button>
                <button class="number" onclick="appendToDisplay('.')">.</button>
                <button class="number" onclick="appendToDisplay('00')">00</button>
                <button class="operator" onclick="appendToDisplay('+')">+</button>
                
                <button class="equals" onclick="calculateResult()">=</button>
            </div>
        </div>

        <div class="history-panel">
            <div class="history-header">
                <h3>📜 Riwayat</h3>
                <button class="clear-history" onclick="clearHistory()">Hapus Semua</button>
            </div>
            <div class="history-list" id="history-list">
                <div class="no-history">Belum ada riwayat perhitungan</div>
            </div>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        const previousDisplay = document.getElementById('previous-display');
        const realtimeResult = document.getElementById('realtime-result');
        const historyList = document.getElementById('history-list');
        
        let calculationHistory = [];
        let lastResult = null;
        let isNewCalculation = false;

        // Operator yang diperbolehkan
        const operators = ['+', '-', '*', '/'];

        function appendToDisplay(value) {
            const currentValue = display.value;

            // Jika ini perhitungan baru setelah hasil, reset kecuali jika operator
            if (isNewCalculation && !operators.includes(value)) {
                display.value = '';
                previousDisplay.textContent = '';
                isNewCalculation = false;
            } else if (isNewCalculation && operators.includes(value)) {
                isNewCalculation = false;
            }

            // Mencegah spam operator (bug fix utama)
            if (operators.includes(value)) {
                // Jika display kosong dan bukan minus (untuk angka negatif)
                if (currentValue === '' && value !== '-') {
                    return;
                }
                
                // Cek karakter terakhir
                const lastChar = currentValue.slice(-1);
                
                // Jika karakter terakhir adalah operator, ganti dengan operator baru
                if (operators.includes(lastChar)) {
                    display.value = currentValue.slice(0, -1) + value;
                    updateRealtimeResult();
                    return;
                }
            }

            // Mencegah multiple decimal points dalam satu angka
            if (value === '.') {
                const parts = currentValue.split(/[\+\-\*\/]/);
                const currentPart = parts[parts.length - 1];
                if (currentPart.includes('.')) {
                    return;
                }
            }

            // Mencegah leading zeros
            if (value === '0' && currentValue === '0') {
                return;
            }

            display.value += value;
            updateRealtimeResult();
        }

        function clearDisplay() {
            display.value = '';
            previousDisplay.textContent = '';
            realtimeResult.textContent = '';
            lastResult = null;
            isNewCalculation = false;
        }

        function backspace() {
            if (isNewCalculation) {
                clearDisplay();
                return;
            }
            display.value = display.value.slice(0, -1);
            updateRealtimeResult();
        }

        function calculateResult() {
            try {
                let expression = display.value;
                
                // Validasi ekspresi
                if (!expression || operators.includes(expression.slice(-1))) {
                    display.value = 'Error';
                    setTimeout(() => {
                        display.value = '';
                        previousDisplay.textContent = '';
                        realtimeResult.textContent = '';
                    }, 1500);
                    return;
                }

                // Hitung hasil
                const result = eval(expression);
                
                // Format hasil
                let formattedResult;
                if (Number.isInteger(result)) {
                    formattedResult = result.toString();
                } else {
                    formattedResult = result.toFixed(8).replace(/\.?0+$/, '');
                }

                // Simpan ke history
                addToHistory(expression, formattedResult);

                // Tampilkan di previous display
                previousDisplay.textContent = expression + ' =';
                
                // Update display dengan hasil
                display.value = formattedResult;
                realtimeResult.textContent = '';
                lastResult = formattedResult;
                isNewCalculation = true;

            } catch (error) {
                display.value = 'Error';
                setTimeout(() => {
                    display.value = '';
                    previousDisplay.textContent = '';
                    realtimeResult.textContent = '';
                }, 1500);
            }
        }

        function updateRealtimeResult() {
            try {
                let expression = display.value;
                
                // Jangan tampilkan hasil jika ekspresi kosong atau diakhiri dengan operator
                if (!expression || operators.includes(expression.slice(-1))) {
                    realtimeResult.textContent = '';
                    return;
                }

                // Validasi ekspresi sebelum menghitung
                // Cek apakah ekspresi valid untuk dihitung
                const validPattern = /^[\d\.\+\-\*\/\(\)]+$/;
                if (!validPattern.test(expression)) {
                    realtimeResult.textContent = '';
                    return;
                }

                // Cek keseimbangan kurung
                const openParens = (expression.match(/\(/g) || []).length;
                const closeParens = (expression.match(/\)/g) || []).length;
                if (openParens !== closeParens) {
                    realtimeResult.textContent = '';
                    return;
                }

                // Hitung hasil sementara
                const result = eval(expression);
                
                // Format hasil
                let formattedResult;
                if (Number.isInteger(result)) {
                    formattedResult = result.toString();
                } else {
                    formattedResult = result.toFixed(8).replace(/\.?0+$/, '');
                }

                // Tampilkan hasil real-time
                realtimeResult.textContent = '= ' + formattedResult;

            } catch (error) {
                // Jika ada error, kosongkan hasil real-time
                realtimeResult.textContent = '';
            }
        }

        function addToHistory(expression, result) {
            calculationHistory.unshift({
                expression: expression,
                result: result,
                timestamp: new Date()
            });

            // Batasi history sampai 50 item
            if (calculationHistory.length > 50) {
                calculationHistory.pop();
            }

            renderHistory();
        }

        function renderHistory() {
            if (calculationHistory.length === 0) {
                historyList.innerHTML = '<div class="no-history">Belum ada riwayat perhitungan</div>';
                return;
            }

            historyList.innerHTML = calculationHistory.map((item, index) => `
                <div class="history-item" onclick="loadFromHistory(${index})">
                    <div class="history-expression">${item.expression}</div>
                    <div class="history-result">= ${item.result}</div>
                </div>
            `).join('');
        }

        function loadFromHistory(index) {
            const item = calculationHistory[index];
            display.value = item.result;
            previousDisplay.textContent = item.expression + ' =';
            realtimeResult.textContent = '';
            isNewCalculation = true;
        }

        function clearHistory() {
            calculationHistory = [];
            renderHistory();
        }

        // Keyboard support
        document.addEventListener('keydown', function(event) {
            const key = event.key;
            
            if (key >= '0' && key <= '9') {
                appendToDisplay(key);
            } else if (key === '+' || key === '-' || key === '*' || key === '/') {
                appendToDisplay(key);
            } else if (key === '.') {
                appendToDisplay('.');
            } else if (key === 'Enter' || key === '=') {
                event.preventDefault();
                calculateResult();
            } else if (key === 'Backspace') {
                backspace();
            } else if (key === 'Escape' || key === 'c' || key === 'C') {
                clearDisplay();
            } else if (key === '(' || key === ')') {
                appendToDisplay(key);
            }
        });
    </script>
</body>
</html>
